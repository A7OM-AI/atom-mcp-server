# Smithery.ai configuration
# https://smithery.ai/docs/build/project-config/smithery-yaml
# The hosted server (https://mcp.atticstandard.com/mcp)
# is the supported way to connect; this local mode is for self-hosting.

runtime: typescript

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - supabaseUrl
      - supabaseKey
    properties:
      supabaseUrl:
        type: string
        description: "Database URL for a self-hosted Attic Standard data store"
      supabaseKey:
        type: string
        description: "Server-side database key for that store"
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['./dist/index.js'],
      env: {
        SUPABASE_URL: config.supabaseUrl,
        SUPABASE_SERVICE_ROLE_KEY: config.supabaseKey,
        TRANSPORT: 'stdio'
      }
    })
  exampleConfig:
    supabaseUrl: "https://your-project.supabase.co"
    supabaseKey: "your-server-side-key"
